<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#2C2C2A}
      .s{font-size:13px;fill:#5F5E5A}
      .l{font-size:13px;fill:#444441}
      .h{font-size:15px;font-weight:600}
      .ln{stroke:#5F5E5A;stroke-width:1.4;fill:none}
      .dl{stroke:#854F0B;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="960" height="680" rx="14" fill="#FBFAF7"/>

  <rect x="20" y="20" width="920" height="450" rx="14" fill="#F3F8F6" stroke="#0F6E56" stroke-width="1" stroke-dasharray="6 4"/>
  <text class="h" x="40" y="46" fill="#085041">门诊区 = 用户态</text>

  <rect x="40" y="60" width="240" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
  <text class="t" x="160" y="84" text-anchor="middle">院务巡查员 = sysmon</text>
  <text class="s" x="160" y="104" text-anchor="middle">不占诊室，到处巡视兜底</text>

  <rect x="360" y="60" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text class="t" x="480" y="84" text-anchor="middle">大厅总候诊区</text>
  <text class="s" x="480" y="104" text-anchor="middle">= 全局队列（加锁）</text>

  <rect x="680" y="60" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text class="t" x="800" y="84" text-anchor="middle">休息室 = 空闲的 M</text>
  <text class="s" x="800" y="104" text-anchor="middle">随时接手空出来的诊室</text>

  <line class="dl" x1="100" y1="116" x2="100" y2="156" marker-end="url(#a)"/>
  <text class="l" x="92" y="142" text-anchor="end">巡查</text>
  <line class="ln" x1="420" y1="116" x2="252" y2="157" marker-end="url(#a)"/>
  <text class="l" x="300" y="138" text-anchor="end">每 61 次叫一次大厅的号</text>
  <line class="ln" x1="540" y1="116" x2="708" y2="157" marker-end="url(#a)"/>
  <line class="dl" x1="800" y1="116" x2="800" y2="156" marker-end="url(#a)"/>

  <rect x="20" y="500" width="920" height="140" rx="14" fill="#F4F3FC" stroke="#534AB7" stroke-width="1" stroke-dasharray="6 4"/>
  <text class="h" x="40" y="526" fill="#3C3489">后勤区 = 内核态</text>

  <rect x="80" y="160" width="340" height="220" rx="12" fill="#EEEDFE" stroke="#534AB7"/>
  <text class="h" x="250" y="184" text-anchor="middle" fill="#3C3489">诊室 = P0</text>
  <rect x="100" y="198" width="300" height="40" rx="6" fill="#FFFFFF" stroke="#AFA9EC"/>
  <text class="s" x="250" y="223" text-anchor="middle">优先位 = runnext：G9</text>
  <rect x="100" y="248" width="300" height="40" rx="6" fill="#FFFFFF" stroke="#AFA9EC"/>
  <text class="s" x="250" y="273" text-anchor="middle">门口候诊椅 = 本地队列：G1 G2 G3</text>
  <rect x="100" y="300" width="300" height="60" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
  <text class="t" x="250" y="325" text-anchor="middle">医生 = M0</text>
  <text class="s" x="250" y="347" text-anchor="middle">正在看的病人 = 运行中的 G7</text>

  <rect x="540" y="160" width="340" height="220" rx="12" fill="#EEEDFE" stroke="#534AB7"/>
  <text class="h" x="710" y="184" text-anchor="middle" fill="#3C3489">诊室 = P1</text>
  <rect x="560" y="198" width="300" height="40" rx="6" fill="#FFFFFF" stroke="#AFA9EC"/>
  <text class="s" x="710" y="223" text-anchor="middle">优先位 = runnext：空</text>
  <rect x="560" y="248" width="300" height="40" rx="6" fill="#FFFFFF" stroke="#AFA9EC"/>
  <text class="s" x="710" y="273" text-anchor="middle">门口候诊椅 = 本地队列：空</text>
  <rect x="560" y="300" width="300" height="60" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
  <text class="t" x="710" y="325" text-anchor="middle">医生 = M1</text>
  <text class="s" x="710" y="347" text-anchor="middle">门口没人了，去隔壁领</text>

  <line class="ln" x1="422" y1="276" x2="538" y2="276" marker-end="url(#a)"/>
  <text class="l" x="480" y="266" text-anchor="middle">领走一半</text>

  <rect x="380" y="400" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text class="t" x="480" y="423" text-anchor="middle">值班医生</text>
  <text class="s" x="480" y="443" text-anchor="middle">= 阻塞在 epoll_wait 的 M</text>
  <line class="ln" x1="580" y1="412" x2="618" y2="384" marker-end="url(#a)"/>
  <text class="l" x="600" y="430">把病人叫回来，放回候诊</text>

  <path class="ln" d="M350 362 L350 545" marker-end="url(#a)"/>
  <text class="l" x="340" y="410" text-anchor="end">病人去做检查</text>
  <text class="l" x="340" y="428" text-anchor="end">= 网络 IO，G 挂起</text>

  <path class="ln" d="M800 362 L800 545" marker-end="url(#a)"/>
  <text class="l" x="810" y="410">陪病人进档案室</text>
  <text class="l" x="810" y="428">= 系统调用阻塞</text>


  <rect x="40" y="548" width="260" height="56" rx="8" fill="#FFFFFF" stroke="#7F77DD"/>
  <text class="t" x="170" y="572" text-anchor="middle">人事科排班</text>
  <text class="s" x="170" y="592" text-anchor="middle">= 内核的线程调度</text>

  <rect x="330" y="548" width="300" height="56" rx="8" fill="#FFFFFF" stroke="#7F77DD"/>
  <text class="t" x="480" y="572" text-anchor="middle">检验科和结果通知中心</text>
  <text class="s" x="480" y="592" text-anchor="middle">= epoll</text>

  <rect x="660" y="548" width="260" height="56" rx="8" fill="#FFFFFF" stroke="#7F77DD"/>
  <text class="t" x="790" y="572" text-anchor="middle">档案室</text>
  <text class="s" x="790" y="592" text-anchor="middle">= 文件读写等阻塞的系统调用</text>

  <line class="ln" x1="480" y1="546" x2="480" y2="458" marker-end="url(#a)"/>
  <text class="l" x="490" y="492">出结果</text>
  <line class="dl" x1="170" y1="546" x2="170" y2="472" marker-end="url(#a)"/>
  <text class="l" x="180" y="492">安排医生上岗</text>

  <text class="s" x="40" y="664">实线：病人（G）的流动；虚线：管理动作</text>
</svg>
