<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#2C2C2A}
      .s{font-size:13px;fill:#5F5E5A}
      .l{font-size:13px;fill:#444441}
      .h{font-size:15px;font-weight:600}
      .ln{stroke:#5F5E5A;stroke-width:1.4;fill:none}
      .dl{stroke:#854F0B;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="960" height="500" rx="14" fill="#FBFAF7"/>

  <rect x="20" y="20" width="540" height="360" rx="14" fill="#F3F8F6" stroke="#0F6E56" stroke-dasharray="6 4"/>
  <text class="h" x="40" y="46" fill="#085041">一个诊室 = 一个线程（Python 里通常就是一个进程）</text>

  <rect x="600" y="20" width="340" height="360" rx="14" fill="#F4F3FC" stroke="#534AB7" stroke-dasharray="6 4"/>
  <text class="h" x="620" y="46" fill="#3C3489">检查科室：替医生等结果的地方</text>

  <rect x="60" y="66" width="470" height="74" rx="8" fill="#F1EFE8" stroke="#888780"/>
  <text class="t" x="295" y="90" text-anchor="middle">候诊区 = 就绪队列</text>
  <text class="s" x="295" y="110" text-anchor="middle">Python：asyncio 的就绪队列</text>
  <text class="s" x="295" y="128" text-anchor="middle">JS：宏任务、微任务队列</text>

  <line class="ln" x1="195" y1="140" x2="195" y2="166" marker-end="url(#a)"/>
  <text class="l" x="205" y="158">叫下一位</text>

  <rect x="60" y="168" width="290" height="164" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
  <text class="t" x="205" y="194" text-anchor="middle">医生 = 执行代码的线程</text>
  <text class="s" x="205" y="220" text-anchor="middle">看病人：执行协程（JS 里是回调）</text>
  <line x1="80" y1="236" x2="330" y2="236" stroke="#9FE1CB" stroke-width="1"/>
  <text class="t" x="205" y="260" text-anchor="middle">两个病人之间自己叫号</text>
  <text class="s" x="205" y="282" text-anchor="middle">= 事件循环，没有专门的分诊护士</text>
  <text class="s" x="205" y="302" text-anchor="middle">Python：asyncio 事件循环</text>
  <text class="s" x="205" y="320" text-anchor="middle">JS：浏览器事件循环、Node 的 libuv</text>

  <line class="dl" x1="350" y1="250" x2="370" y2="250"/>
  <rect x="370" y="220" width="160" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
  <text class="t" x="450" y="245" text-anchor="middle">唯一的笔 = GIL</text>
  <text class="s" x="450" y="267" text-anchor="middle">Python 特有，JS 没有</text>

  <rect x="630" y="70" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#7F77DD"/>
  <text class="t" x="770" y="95" text-anchor="middle">Palo 等外部服务</text>
  <text class="s" x="770" y="117" text-anchor="middle">真正做检查的地方</text>

  <rect x="630" y="220" width="280" height="80" rx="8" fill="#FFFFFF" stroke="#7F77DD"/>
  <text class="t" x="770" y="245" text-anchor="middle">结果通知中心</text>
  <text class="s" x="770" y="267" text-anchor="middle">Python、Node：操作系统的 epoll</text>
  <text class="s" x="770" y="287" text-anchor="middle">浏览器：浏览器的其他线程</text>

  <line class="ln" x1="720" y1="218" x2="720" y2="132" marker-end="url(#a)"/>
  <text class="l" x="712" y="180" text-anchor="end">发出查询</text>
  <line class="ln" x1="840" y1="132" x2="840" y2="218" marker-end="url(#a)"/>
  <text class="l" x="848" y="180">结果回来</text>

  <path class="ln" d="M195 332 L195 410 L770 410 L770 302" marker-end="url(#a)"/>
  <text class="l" x="482" y="432" text-anchor="middle">开检查单 = await：病人自己去排队，医生接着叫下一位</text>

  <path class="ln" d="M630 250 L580 250 L580 103 L532 103" marker-end="url(#a)"/>
  <text class="l" x="556" y="95" text-anchor="middle">通知</text>

  <text class="s" x="40" y="466">候诊区空了，医生就自己守着结果通知中心的电话（Python 和 Node 里是同一个线程调用 epoll_wait）</text>
  <text class="s" x="40" y="488">多进程 = 再开几间这样的诊室，每间都有自己的医生和笔</text>
</svg>
